---
version: 2.1

orbs:
  node: circleci/node@5.1.0

jobs:
  apps-checks:
    docker:
      - image: cimg/base:current
    resource_class: medium+
    steps:
      - checkout
      - node/install
      - run:
          name: Install root dependencies
          # min-release-age needs npm 11.10 or newer; Node 20 bundles npm 10. Only this install uses npm 11.
          command: |
            npm install --prefix "$HOME/npm11" npm@11.19.1
            "$HOME/npm11/node_modules/.bin/npm" install
      - run:
          name: List changed packages
          command: npx lerna ls --since main --all 2>&1 | tee changed-packages.txt
      - run:
          name: Install apps dependencies
          command: npm run install-apps
      - run:
          name: Build apps
          command: npm run build-apps
      - run:
          name: Test apps
          command: npm run test-apps

workflows:
  version: 2
  apps-ci-pipeline:
    jobs:
      - apps-checks:
          filters:
            branches:
              ignore:
                - main